# Скопируйте в litagent.toml. Ключи лучше задавать переменными окружения
# (NCBI_API_KEY, OPENALEX_API_KEY, S2_API_KEY, CORE_API_KEY, LITAGENT_EMAIL).

email = "you@example.org"          # обязателен: идёт в User-Agent, Crossref mailto, Unpaywall, NCBI
out = "library"                    # куда класть pdf/, xml/, index.json, runs/
sources = ["openalex", "pubmed", "europepmc", "arxiv", "semanticscholar", "crossref", "core", "doaj"]
limit_per_source = 50
download_workers = 10              # параллельных скачиваний (1 — по одному); к одному хосту всё равно по одному соединению
download_timeout = 25              # сек на файл (простой сокета)
download_retries = 2               # попыток на файл (обычные запросы API: 5)
pdf_only = false                   # true: оставлять только статьи с реально скачанным PDF (как --pdf-only)
pubmed_pmc = true                  # PubMed ищет ещё и в PMC и качает оттуда OA-PDF (false — выключить)
custom_sites = "custom_sites.json"   # свои сайты (создаётся командой `sites add`)
max_downloads = 20                 # потолок успешных скачиваний за запуск (--max-downloads)
folders_by_source = true           # раскладывать файлы по папкам источников: pdf/<источник>/ (false или --flat — всё в pdf/)
presets_file = "presets.json"      # пресеты ручного режима (manual --save-preset / --preset)
deepen_rounds = 5                  # при --count N: сколько раз углублять поиск, если N PDF ещё не набрано
deepen_limit_cap = 1000            # при углублении лимит на источник растёт ×2, но не выше этого значения

[keys]                             # необязательно: лучше через переменные окружения
ncbi = ""                          # PubMed: 10 запр./с вместо 3
openalex = ""                      # ОБЯЗАТЕЛЕН для OpenAlex (бесплатный)
s2 = ""                            # Semantic Scholar: без ключа часто 429
core = ""                          # ОБЯЗАТЕЛЕН для CORE (бесплатный)
gigachat_client_id = ""            # GigaChat: Client ID из кабинета Sber Studio (или переменная GIGACHAT_CLIENT_ID)
gigachat_client_secret = ""        # GigaChat: Client Secret оттуда же (или GIGACHAT_CLIENT_SECRET); Base64-ключ агент соберёт сам
gigachat = ""                      # запасной вариант: готовый ключ авторизации (лучше переменная GIGACHAT_CREDENTIALS)

[llm]                              # модель для авто-режима: локальная или облачная
provider = "ollama"                # "ollama", "openai" (LM Studio, llama.cpp server, vLLM) или "gigachat" (облако Сбера)
base_url = ""                      # пусто = http://127.0.0.1:11434 (ollama) / http://localhost:1234/v1 (openai) / https://api.giga.chat/v1 (gigachat)
model = "gemma4"
temperature = 0.2
timeout = 300
num_ctx = 8192                      # окно контекста Ollama; без него Ollama режет длинный промпт (заметки из .tex)

# GigaChat: реквизиты — [keys] gigachat_client_id + gigachat_client_secret (личный кабинет Sber Studio),
# Base64-ключ авторизации агент собирает сам. Токен доступа получает и обновляет сам (OAuth, 30 минут).
# Нужен сертификат Минцифры:
# установите Russian Trusted Root CA в систему или укажите PEM в ca_bundle.
# provider = "gigachat"
# model = "GigaChat"               # GigaChat, GigaChat-Pro, GigaChat-Max, GigaChat-2, GigaChat-2-Pro, GigaChat-2-Max, GigaChat-3-Lightning
# scope = "GIGACHAT_API_PERS"      # GIGACHAT_API_PERS (физлица) | GIGACHAT_API_CORP | GIGACHAT_API_B2B (юрлица)
# ca_bundle = ""                   # путь к russian_trusted_root_ca_pem.crt, если сертификат не установлен в системе
# oauth_url = ""                   # пусто = https://ngw.devices.sberbank.ru:9443/api/v2/oauth

[auto]
rounds = 2                         # 1 = без уточнения плана
min_results = 10
llm_filter = false                 # оценка релевантности каждой найденной статьи моделью
min_score = 6
notes = ["literature_search_systems.tex"]   # файл(ы) с пометками: .tex, .md, .txt

[web]                              # веб-интерфейс: python -m litagent web
host = "127.0.0.1"                 # только этот компьютер; другой адрес откроет конфиг и ключи сети
port = 8765
open_browser = true                # открывать браузер при запуске (выключить: --no-browser)
